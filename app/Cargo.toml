[package]
name = "jianxia"
version = "0.1.0"
edition = "2021"
description = "笺匣：纯 Rust SSR 页面 + 同进程 Telegram Bot"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
askama = "0.16"
axum = { version = "0.8", features = ["form", "json", "macros", "multipart", "query"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.13"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
scrypt = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
image = "0.25.10"
zip = "8.6.0"
tokio-util = { version = "0.7.19", features = ["io"] }
